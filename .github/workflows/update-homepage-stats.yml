name: Update homepage statistics

on:
  schedule:
    # 08:17 Asia/Shanghai; avoid the busy start of the hour.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-homepage-stats.yml'
      - 'scripts/update_homepage_stats.py'
      - 'scripts/test_homepage_stats.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: homepage-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test statistics updater
        run: python -m unittest discover -s scripts -p test_homepage_stats.py
      - name: Fetch current counts
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_homepage_stats.py
      - name: Save statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/github_stars.json _data/huggingface_downloads.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update homepage publication statistics'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Rebuild GitHub Pages
        # GITHUB_TOKEN pushes do not trigger Pages, so explicitly request a build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report any failed metrics
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Some metrics could not be refreshed. Their previous values were retained.'
          exit 1
